<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo Flexbox</title>
  <style>
    body {
      margin: 0;
      background-color: #7589b4;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      box-sizing: border-box;
    }

    /* Header centrado moderno */
    header {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      background-color: #4070ff;
      color: white;
      padding: 20px 0;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      font-size: 1.5em;
      font-weight: bold;
    }

    .contenedor {
      border: 2px solid rgb(0, 0, 0);
      width: 1200px;
      height: 700px;
      display: flex;
      flex-direction: column;
      justify-content: initial;
      align-items:flex-start;
      gap: 15px;
      padding: 20px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .caja {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgb(27, 123, 201);
      color: white;
      font-size: 3em;
      font-weight: bold;
      border-radius: 8px;
    }

    .caja1{
      width: 150px;
      height: 150px;
      background-color: rgb(255, 133, 154);
    }
    .caja2 {
      width: 150px;
      height: 200px;
    }

    .caja3 {
      width: 250px;
      height: 150px;
      background-color: rgb(255, 38, 0);
    }

    .caja4 {
      width: 150px;
      height: 100px;
      background-color: rgb(10, 255, 116);
    }
  </style>
</head>
<body>

  <header>Ejercicio de Clase - Ezequiel</header>

  <div class="contenedor">
    <div class="caja caja1">1</div>
    <div class="caja caja2">2</div>
    <div class="caja caja3">3</div>
    <div class="caja caja4">4</div>
  </div>

</body>
</html>
